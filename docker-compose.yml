# Local PostgreSQL for development, so local matches production (Neon/Vercel Postgres).
#   docker compose up -d
#   DATABASE_URL="postgresql://owlflow:owlflow@localhost:5433/owlflow?schema=public"

services:
  postgres:
    image: postgres:16-alpine
    container_name: owlflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: owlflow
      POSTGRES_PASSWORD: owlflow
      POSTGRES_DB: owlflow
    ports:
      - "5433:5432"
    volumes:
      - owlflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owlflow -d owlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  owlflow-pgdata:
